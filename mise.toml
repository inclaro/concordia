min_version = "2026.10.17"

[settings]
auto_install = false
task.run_auto_install = false

[task_config]
shell = '{{ "powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command" if os() == "windows" else "bash -c" }}'
dir = "{{config_root}}"

[vars]
go_version = "1.27.4"
node_version = "24"
golangci_lint_version = "v2.15.0"
gofumpt_version = "v0.12.0"
goimports_version = "v0.52.0"
gotestsum_version = "v1.13.0"
gotestfmt_version = "v2.5.0"
go_mod_outdated_version = "v0.9.0"
actionlint_version = "v1.7.12"
svu_version = "v3.4.1"
govulncheck_version = "v1.9.0"
markdownlint_cli2_version = "0.24.0"
goreleaser_version = "v2.20.2"
cosign_version = "v3.1.4"
helm_version = "v4.3.1"
kustomize_version = "v5.8.3"
repo_name = "concordia"
binary_name = "concordia"
output_dir = "./dist"

[env]
GOBIN = "{{config_root}}/.bin"
GOTOOLCHAIN = "local"
GOROOT = false
_.path = [
  "{{config_root}}/.bin",
  "{{config_root}}/.bin/go/bin",
  "{{config_root}}/.bin/node/bin",
  "{{config_root}}/.bin/node",
  "{{config_root}}/.bin/npm/bin",
  "{{config_root}}/.bin/npm",
]

[tasks.default]
description = "Show available tasks."
run = "'{{mise_bin}}' tasks ls"
run_windows = "& '{{mise_bin}}' tasks ls"

[tasks.setup]
description = "Install all development and release tools."
run = [{ task = "tools:install" }, { task = "tools:release" }, { task = "tools:cbm" }]

[tasks."tools:install"]
description = "Install pinned repository-local development tools."
run = '''
set -euo pipefail
root=$PWD
bin=$root/.bin
go_version='{{vars.go_version}}'
node_version='{{vars.node_version}}'
cosign_version='{{vars.cosign_version}}'
helm_version='{{vars.helm_version}}'
kustomize_version='{{vars.kustomize_version}}'
stage=

fail() {
  printf 'tools:install: %s\n' "$*" >&2
  exit 1
}

cleanup() {
  if [[ -n $stage ]]; then
    rm -rf "$stage"
  fi
}
trap cleanup EXIT INT TERM

[[ ! -L $bin ]] || fail '.bin must not be a symlink'
mkdir -p "$bin" "$root/.tmp"
for path in "$bin/go" "$bin/node" "$bin/npm"; do
  [[ ! -L $path ]] || fail "tool installation path must not be a symlink: $path"
done
for name in golangci-lint gofumpt goimports gotestsum gotestfmt go-mod-outdated actionlint svu govulncheck cosign helm kustomize; do
  [[ ! -L $bin/$name ]] || fail "tool destination must not be a symlink: $bin/$name"
done

stage=$(mktemp -d "$root/.tmp/tools-install.XXXXXX")
if [[ ! -x $bin/go/bin/go ]] || [[ $($bin/go/bin/go version 2>/dev/null) != "go version go${go_version} "* ]]; then
  "{{mise_bin}}" install-into "go@${go_version}" "$stage/go"
  rm -rf "$bin/go"
  mv "$stage/go" "$bin/go"
fi
if [[ ! -x $bin/node/bin/node ]] || [[ $($bin/node/bin/node --version 2>/dev/null) != "v${node_version}."* ]]; then
  "{{mise_bin}}" install-into "node@${node_version}" "$stage/node"
  rm -rf "$bin/node"
  mv "$stage/node" "$bin/node"
fi
if [[ ! -x $bin/cosign ]] || ! "$bin/cosign" version 2>/dev/null | grep -Eq "^GitVersion:[[:space:]]+${cosign_version}\$"; then
  "{{mise_bin}}" install-into "cosign@${cosign_version}" "$stage/cosign"
  [[ -f $stage/cosign/cosign ]] || fail "cosign@${cosign_version} did not install a cosign binary"
  rm -f "$bin/cosign"
  mv "$stage/cosign/cosign" "$bin/cosign"
  chmod 0755 "$bin/cosign"
fi
# helm prints `v4.3.1+g<commit>`; the release archive nests the binary in a platform directory.
if [[ ! -x $bin/helm ]] || [[ $("$bin/helm" version --short 2>/dev/null) != "${helm_version}+g"* ]]; then
  "{{mise_bin}}" install-into "helm@${helm_version}" "$stage/helm"
  helm_staged=$(find "$stage/helm" -type f -name helm -print -quit)
  [[ -n $helm_staged ]] || fail "helm@${helm_version} did not install a helm binary"
  rm -f "$bin/helm"
  mv "$helm_staged" "$bin/helm"
  chmod 0755 "$bin/helm"
fi
if [[ ! -x $bin/kustomize ]] || [[ $("$bin/kustomize" version 2>/dev/null) != "${kustomize_version}" ]]; then
  "{{mise_bin}}" install-into "kustomize@${kustomize_version}" "$stage/kustomize"
  [[ -f $stage/kustomize/kustomize ]] || fail "kustomize@${kustomize_version} did not install a kustomize binary"
  rm -f "$bin/kustomize"
  mv "$stage/kustomize/kustomize" "$bin/kustomize"
  chmod 0755 "$bin/kustomize"
fi

export PATH="$bin:$bin/go/bin:$bin/node/bin:$bin/npm/bin:$PATH"
export GOBIN="$bin"
export GOTOOLCHAIN=local
unset GOROOT

"$bin/go/bin/go" install 'github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{vars.golangci_lint_version}}'
"$bin/go/bin/go" install 'mvdan.cc/gofumpt@{{vars.gofumpt_version}}'
"$bin/go/bin/go" install 'golang.org/x/tools/cmd/goimports@{{vars.goimports_version}}'
"$bin/go/bin/go" install 'gotest.tools/gotestsum@{{vars.gotestsum_version}}'
"$bin/go/bin/go" install 'github.com/gotesttools/gotestfmt/v2/cmd/gotestfmt@{{vars.gotestfmt_version}}'
"$bin/go/bin/go" install 'github.com/psampaz/go-mod-outdated@{{vars.go_mod_outdated_version}}'
"$bin/go/bin/go" install 'github.com/rhysd/actionlint/cmd/actionlint@{{vars.actionlint_version}}'
"$bin/go/bin/go" install 'github.com/caarlos0/svu/v3@{{vars.svu_version}}'
"$bin/go/bin/go" install 'golang.org/x/vuln/cmd/govulncheck@{{vars.govulncheck_version}}'
"$bin/node/bin/npm" install --global --prefix "$bin/npm" 'markdownlint-cli2@{{vars.markdownlint_cli2_version}}'
'''
run_windows = '''
$ErrorActionPreference = 'Stop'
Set-StrictMode -Version 3.0

$root = (Get-Location).ProviderPath
$bin = Join-Path $root '.bin'
$goVersion = '{{vars.go_version}}'
$nodeVersion = '{{vars.node_version}}'
$cosignVersion = '{{vars.cosign_version}}'
$helmVersion = '{{vars.helm_version}}'
$kustomizeVersion = '{{vars.kustomize_version}}'
$stage = $null
$npmStage = $null

function Stop-ToolInstall {
    param([Parameter(Mandatory = $true)][string]$Message)
    throw "tools:install: $Message"
}

function Assert-NotReparsePoint {
    param([Parameter(Mandatory = $true)][string]$Path)
    if (Test-Path -LiteralPath $Path) {
        $item = Get-Item -LiteralPath $Path -Force
        if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
            Stop-ToolInstall "tool installation path must not be a symlink or reparse point: $Path"
        }
    }
}

function Invoke-NativeCommand {
    param(
        [Parameter(Mandatory = $true)][string]$Command,
        [Parameter(Mandatory = $true)][string[]]$Arguments
    )
    & $Command @Arguments
    if ($LASTEXITCODE -ne 0) {
        Stop-ToolInstall "command failed with exit code ${LASTEXITCODE}: $Command"
    }
}

Assert-NotReparsePoint -Path $bin
New-Item -ItemType Directory -Path $bin -Force | Out-Null
New-Item -ItemType Directory -Path (Join-Path $root '.tmp') -Force | Out-Null

foreach ($path in @(
    (Join-Path $bin 'go'),
    (Join-Path $bin 'node'),
    (Join-Path $bin 'npm')
)) {
    Assert-NotReparsePoint -Path $path
}
foreach ($name in @(
    'golangci-lint.exe',
    'gofumpt.exe',
    'goimports.exe',
    'gotestsum.exe',
    'gotestfmt.exe',
    'go-mod-outdated.exe',
    'actionlint.exe',
    'svu.exe',
    'govulncheck.exe',
    'cosign.exe',
    'helm.exe',
    'kustomize.exe'
)) {
    Assert-NotReparsePoint -Path (Join-Path $bin $name)
}

$stage = Join-Path $root ('.tmp\tools-install.' + [System.Guid]::NewGuid().ToString('N'))
New-Item -ItemType Directory -Path $stage | Out-Null
try {
    $goExecutable = Join-Path $bin 'go\bin\go.exe'
    $installGo = -not (Test-Path -LiteralPath $goExecutable -PathType Leaf)
    if (-not $installGo) {
        $reportedGoVersion = (& $goExecutable version 2>$null) -join "`n"
        $installGo = $LASTEXITCODE -ne 0 -or $reportedGoVersion -notlike "go version go$goVersion *"
    }
    if ($installGo) {
        $stagedGo = Join-Path $stage 'go'
        Invoke-NativeCommand -Command '{{mise_bin}}' -Arguments @('install-into', "go@$goVersion", $stagedGo)
        $goPath = Join-Path $bin 'go'
        if (Test-Path -LiteralPath $goPath) {
            Remove-Item -LiteralPath $goPath -Recurse -Force
        }
        Move-Item -LiteralPath $stagedGo -Destination $goPath
    }

    $nodeExecutable = Join-Path $bin 'node\node.exe'
    $installNode = -not (Test-Path -LiteralPath $nodeExecutable -PathType Leaf)
    if (-not $installNode) {
        $reportedNodeVersion = (& $nodeExecutable --version 2>$null) -join "`n"
        $installNode = $LASTEXITCODE -ne 0 -or $reportedNodeVersion -notlike "v$nodeVersion.*"
    }
    if ($installNode) {
        $stagedNode = Join-Path $stage 'node'
        Invoke-NativeCommand -Command '{{mise_bin}}' -Arguments @('install-into', "node@$nodeVersion", $stagedNode)
        $nodePath = Join-Path $bin 'node'
        if (Test-Path -LiteralPath $nodePath) {
            Remove-Item -LiteralPath $nodePath -Recurse -Force
        }
        Move-Item -LiteralPath $stagedNode -Destination $nodePath
    }

    $cosignExecutable = Join-Path $bin 'cosign.exe'
    $installCosign = -not (Test-Path -LiteralPath $cosignExecutable -PathType Leaf)
    if (-not $installCosign) {
        $reportedCosignVersion = (& $cosignExecutable version 2>$null) -join "`n"
        $installCosign = $LASTEXITCODE -ne 0 -or $reportedCosignVersion -notmatch "(?m)^GitVersion:\s+$([regex]::Escape($cosignVersion))$"
    }
    if ($installCosign) {
        $stagedCosign = Join-Path $stage 'cosign'
        Invoke-NativeCommand -Command '{{mise_bin}}' -Arguments @('install-into', "cosign@$cosignVersion", $stagedCosign)
        $stagedCosignExecutable = Get-ChildItem -LiteralPath $stagedCosign -Filter 'cosign*.exe' -File | Select-Object -First 1
        if ($null -eq $stagedCosignExecutable) {
            Stop-ToolInstall "cosign@$cosignVersion did not install a cosign executable"
        }
        if (Test-Path -LiteralPath $cosignExecutable) {
            Remove-Item -LiteralPath $cosignExecutable -Force
        }
        Move-Item -LiteralPath $stagedCosignExecutable.FullName -Destination $cosignExecutable
    }

    # helm prints `v4.3.1+g<commit>`; the release archive nests the binary in a platform directory.
    $helmExecutable = Join-Path $bin 'helm.exe'
    $installHelm = -not (Test-Path -LiteralPath $helmExecutable -PathType Leaf)
    if (-not $installHelm) {
        $reportedHelmVersion = (& $helmExecutable version --short 2>$null) -join "`n"
        $installHelm = $LASTEXITCODE -ne 0 -or $reportedHelmVersion -notlike "$helmVersion+g*"
    }
    if ($installHelm) {
        $stagedHelm = Join-Path $stage 'helm'
        Invoke-NativeCommand -Command '{{mise_bin}}' -Arguments @('install-into', "helm@$helmVersion", $stagedHelm)
        $stagedHelmExecutable = Get-ChildItem -LiteralPath $stagedHelm -Filter 'helm.exe' -File -Recurse | Select-Object -First 1
        if ($null -eq $stagedHelmExecutable) {
            Stop-ToolInstall "helm@$helmVersion did not install a helm executable"
        }
        if (Test-Path -LiteralPath $helmExecutable) {
            Remove-Item -LiteralPath $helmExecutable -Force
        }
        Move-Item -LiteralPath $stagedHelmExecutable.FullName -Destination $helmExecutable
    }

    $kustomizeExecutable = Join-Path $bin 'kustomize.exe'
    $installKustomize = -not (Test-Path -LiteralPath $kustomizeExecutable -PathType Leaf)
    if (-not $installKustomize) {
        $reportedKustomizeVersion = ((& $kustomizeExecutable version 2>$null) -join "`n").Trim()
        $installKustomize = $LASTEXITCODE -ne 0 -or $reportedKustomizeVersion -ne $kustomizeVersion
    }
    if ($installKustomize) {
        $stagedKustomize = Join-Path $stage 'kustomize'
        Invoke-NativeCommand -Command '{{mise_bin}}' -Arguments @('install-into', "kustomize@$kustomizeVersion", $stagedKustomize)
        $stagedKustomizeExecutable = Get-ChildItem -LiteralPath $stagedKustomize -Filter 'kustomize*.exe' -File | Select-Object -First 1
        if ($null -eq $stagedKustomizeExecutable) {
            Stop-ToolInstall "kustomize@$kustomizeVersion did not install a kustomize executable"
        }
        if (Test-Path -LiteralPath $kustomizeExecutable) {
            Remove-Item -LiteralPath $kustomizeExecutable -Force
        }
        Move-Item -LiteralPath $stagedKustomizeExecutable.FullName -Destination $kustomizeExecutable
    }

    $goExecutable = Join-Path $bin 'go\bin\go.exe'
    $npmExecutable = Join-Path $bin 'node\npm.cmd'
    $npmPrefix = Join-Path $bin 'npm'
    $env:PATH = @(
        $bin,
        (Join-Path $bin 'go\bin'),
        (Join-Path $bin 'node'),
        (Join-Path $bin 'npm'),
        $env:PATH
    ) -join [System.IO.Path]::PathSeparator
    $env:GOBIN = $bin
    $env:GOTOOLCHAIN = 'local'
    Remove-Item Env:GOROOT -ErrorAction SilentlyContinue

    foreach ($package in @(
        'github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{vars.golangci_lint_version}}',
        'mvdan.cc/gofumpt@{{vars.gofumpt_version}}',
        'golang.org/x/tools/cmd/goimports@{{vars.goimports_version}}',
        'gotest.tools/gotestsum@{{vars.gotestsum_version}}',
        'github.com/gotesttools/gotestfmt/v2/cmd/gotestfmt@{{vars.gotestfmt_version}}',
        'github.com/psampaz/go-mod-outdated@{{vars.go_mod_outdated_version}}',
        'github.com/rhysd/actionlint/cmd/actionlint@{{vars.actionlint_version}}',
        'github.com/caarlos0/svu/v3@{{vars.svu_version}}',
        'golang.org/x/vuln/cmd/govulncheck@{{vars.govulncheck_version}}'
    )) {
        Invoke-NativeCommand -Command $goExecutable -Arguments @('install', $package)
    }
    # npm.cmd delegates through cmd.exe, which cannot use UNC paths.
    # Install locally, then move only the completed package tree into .bin.
    $npmStage = Join-Path $env:TEMP (
        'go-project-template-npm.' + [System.Guid]::NewGuid().ToString('N')
    )
    Invoke-NativeCommand -Command $npmExecutable -Arguments @(
        'install',
        '--global',
        '--prefix',
        $npmStage,
        'markdownlint-cli2@{{vars.markdownlint_cli2_version}}'
    )
    $stagedNpmPrefix = Join-Path $stage 'npm'
    Copy-Item -LiteralPath $npmStage -Destination $stagedNpmPrefix -Recurse
    if (Test-Path -LiteralPath $npmPrefix) {
        Remove-Item -LiteralPath $npmPrefix -Recurse -Force
    }
    Move-Item -LiteralPath $stagedNpmPrefix -Destination $npmPrefix
} finally {
    if ($null -ne $stage -and (Test-Path -LiteralPath $stage)) {
        Remove-Item -LiteralPath $stage -Recurse -Force
    }
    if ($null -ne $npmStage -and (Test-Path -LiteralPath $npmStage)) {
        Remove-Item -LiteralPath $npmStage -Recurse -Force
    }
}
'''

[tasks."tools:release"]
description = "Install the pinned repository-local GoReleaser binary."
run = '''
set -euo pipefail
root=$PWD
bin=$root/.bin
version='{{vars.goreleaser_version}}'
stage=

fail() {
  printf 'tools:release: %s\n' "$*" >&2
  exit 1
}

cleanup() {
  if [[ -n $stage ]]; then
    rm -rf "$stage"
  fi
}
trap cleanup EXIT INT TERM

[[ ! -L $bin ]] || fail '.bin must not be a symlink'
[[ ! -L $bin/goreleaser ]] || fail 'GoReleaser destination must not be a symlink'
mkdir -p "$bin" "$root/.tmp"
case "$(uname -s)" in
  Linux) os=Linux ;;
  Darwin) os=Darwin ;;
  *) fail "unsupported GoReleaser host: $(uname -s)" ;;
esac
case "$(uname -m)" in
  x86_64|amd64) arch=x86_64 ;;
  arm64|aarch64) arch=arm64 ;;
  *) fail "unsupported GoReleaser architecture: $(uname -m)" ;;
esac
asset="goreleaser_${os}_${arch}.tar.gz"
base="https://github.com/goreleaser/goreleaser/releases/download/${version}"
stage=$(mktemp -d "$root/.tmp/goreleaser-install.XXXXXX")
mkdir -p "$stage/extract"
curl --fail --location --silent --show-error "$base/$asset" --output "$stage/$asset"
curl --fail --location --silent --show-error "$base/checksums.txt" --output "$stage/checksums.txt"
expected=
while read -r checksum filename; do
  if [[ $filename == "$asset" ]]; then
    expected=$checksum
    break
  fi
done < "$stage/checksums.txt"
[[ -n $expected ]] || fail "checksum missing for $asset"
if command -v sha256sum >/dev/null 2>&1; then
  output=$(sha256sum "$stage/$asset")
  actual=${output%% *}
elif command -v shasum >/dev/null 2>&1; then
  output=$(shasum -a 256 "$stage/$asset")
  actual=${output%% *}
else
  fail 'sha256sum or shasum is required'
fi
[[ $actual == "$expected" ]] || fail "checksum verification failed for $asset"
tar -xzf "$stage/$asset" -C "$stage/extract"
[[ -f $stage/extract/goreleaser ]] || fail 'release archive does not contain goreleaser'
install -m 0755 "$stage/extract/goreleaser" "$bin/goreleaser"
'''
run_windows = '''
$ErrorActionPreference = 'Stop'
Set-StrictMode -Version 3.0

$root = (Get-Location).ProviderPath
$bin = Join-Path $root '.bin'
$version = '{{vars.goreleaser_version}}'
$stage = $null

function Stop-ReleaseInstall {
    param([Parameter(Mandatory = $true)][string]$Message)
    throw "tools:release: $Message"
}

function Assert-NotReparsePoint {
    param([Parameter(Mandatory = $true)][string]$Path)
    if (Test-Path -LiteralPath $Path) {
        $item = Get-Item -LiteralPath $Path -Force
        if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
            Stop-ReleaseInstall "destination must not be a symlink or reparse point: $Path"
        }
    }
}

Assert-NotReparsePoint -Path $bin
New-Item -ItemType Directory -Path $bin -Force | Out-Null
New-Item -ItemType Directory -Path (Join-Path $root '.tmp') -Force | Out-Null
$destination = Join-Path $bin 'goreleaser.exe'
Assert-NotReparsePoint -Path $destination

$architecture = switch ($env:PROCESSOR_ARCHITECTURE) {
    'AMD64' { 'x86_64' }
    'ARM64' { 'arm64' }
    default { Stop-ReleaseInstall "unsupported GoReleaser architecture: $env:PROCESSOR_ARCHITECTURE" }
}
$asset = "goreleaser_Windows_${architecture}.zip"
$baseUrl = "https://github.com/goreleaser/goreleaser/releases/download/$version"
$stage = Join-Path $root ('.tmp\goreleaser-install.' + [System.Guid]::NewGuid().ToString('N'))
$extract = Join-Path $stage 'extract'
New-Item -ItemType Directory -Path $extract -Force | Out-Null

try {
    $archive = Join-Path $stage $asset
    $checksums = Join-Path $stage 'checksums.txt'
    Invoke-WebRequest -UseBasicParsing -Uri "$baseUrl/$asset" -OutFile $archive
    Invoke-WebRequest -UseBasicParsing -Uri "$baseUrl/checksums.txt" -OutFile $checksums

    $expected = $null
    foreach ($line in [System.IO.File]::ReadAllLines($checksums)) {
        if ($line -match '^([0-9a-fA-F]{64})\s+(.+)$' -and $Matches[2] -eq $asset) {
            $expected = $Matches[1].ToLowerInvariant()
            break
        }
    }
    if ([string]::IsNullOrEmpty($expected)) {
        Stop-ReleaseInstall "checksum missing for $asset"
    }

    $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
    if ($actual -ne $expected) {
        Stop-ReleaseInstall "checksum verification failed for $asset"
    }

    Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
    $source = Join-Path $extract 'goreleaser.exe'
    if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
        Stop-ReleaseInstall 'release archive does not contain goreleaser.exe'
    }
    Copy-Item -LiteralPath $source -Destination $destination -Force
} finally {
    if ($null -ne $stage -and (Test-Path -LiteralPath $stage)) {
        Remove-Item -LiteralPath $stage -Recurse -Force
    }
}
'''

[tasks."tools:cbm"]
description = "Install the pinned codebase-memory-mcp build into .bin."
run = '''
set -euo pipefail
root=$PWD
bin=$root/.bin
pin=$root/internal/cbmpin/cbm-pin.tsv
stage=

fail() {
  printf 'tools:cbm: %s\n' "$*" >&2
  exit 1
}

cleanup() {
  if [[ -n $stage ]]; then
    rm -rf "$stage"
  fi
}
trap cleanup EXIT INT TERM

sha256_of() {
  local output
  if command -v sha256sum >/dev/null 2>&1; then
    output=$(sha256sum "$1")
  elif command -v shasum >/dev/null 2>&1; then
    output=$(shasum -a 256 "$1")
  else
    fail 'sha256sum or shasum is required'
  fi
  printf '%s' "${output%% *}"
}

[[ -f $pin ]] || fail "missing $pin"
[[ ! -L $bin ]] || fail '.bin must not be a symlink'
[[ ! -L $bin/codebase-memory-mcp ]] || fail 'destination must not be a symlink'
mkdir -p "$bin" "$root/.tmp"
case "$(uname -s)" in
  Linux) goos=linux ;;
  Darwin) goos=darwin ;;
  *) fail "unsupported host: $(uname -s)" ;;
esac
case "$(uname -m)" in
  x86_64|amd64) goarch=amd64 ;;
  arm64|aarch64) goarch=arm64 ;;
  *) fail "unsupported architecture: $(uname -m)" ;;
esac
platform=$goos-$goarch
version=$(awk -F '\t' '$1 == "version" {print $2}' "$pin")
repository=$(awk -F '\t' '$1 == "repository" {print $2}' "$pin")
row=$(awk -F '\t' -v platform="$platform" '$1 == platform {print}' "$pin")
[[ -n $version && -n $repository ]] || fail "$pin has no version or repository"
[[ -n $row ]] || fail "$pin has no entry for $platform"
IFS=$'\t' read -r _ archive archive_sha binary binary_sha <<< "$row"

if [[ -f $bin/$binary ]] && [[ $(sha256_of "$bin/$binary") == "$binary_sha" ]]; then
  printf 'codebase-memory-mcp %s already installed in %s\n' "$version" "$bin"
  exit 0
fi

stage=$(mktemp -d "$root/.tmp/cbm-install.XXXXXX")
mkdir -p "$stage/extract"
curl --fail --location --silent --show-error \
  "https://github.com/$repository/releases/download/$version/$archive" --output "$stage/$archive"
[[ $(sha256_of "$stage/$archive") == "$archive_sha" ]] || fail "checksum verification failed for $archive"
tar -xzf "$stage/$archive" -C "$stage/extract" "$binary"
[[ -f $stage/extract/$binary ]] || fail "release archive does not contain $binary"
[[ $(sha256_of "$stage/extract/$binary") == "$binary_sha" ]] || fail "checksum verification failed for $binary"
install -m 0755 "$stage/extract/$binary" "$bin/.$binary.new"
mv -f "$bin/.$binary.new" "$bin/$binary"
printf 'installed codebase-memory-mcp %s into %s\n' "$version" "$bin"
'''
run_windows = '''
$ErrorActionPreference = 'Stop'
Set-StrictMode -Version 3.0

$root = (Get-Location).ProviderPath
$bin = Join-Path $root '.bin'
$pin = Join-Path $root 'internal\cbmpin\cbm-pin.tsv'
$stage = $null

function Stop-CbmInstall {
    param([Parameter(Mandatory = $true)][string]$Message)
    throw "tools:cbm: $Message"
}

function Assert-NotReparsePoint {
    param([Parameter(Mandatory = $true)][string]$Path)
    if (Test-Path -LiteralPath $Path) {
        $item = Get-Item -LiteralPath $Path -Force
        if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
            Stop-CbmInstall "destination must not be a symlink or reparse point: $Path"
        }
    }
}

function Get-Sha256 {
    param([Parameter(Mandatory = $true)][string]$Path)
    return (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash.ToLowerInvariant()
}

if (-not (Test-Path -LiteralPath $pin -PathType Leaf)) {
    Stop-CbmInstall "missing $pin"
}
Assert-NotReparsePoint -Path $bin
New-Item -ItemType Directory -Path $bin -Force | Out-Null
New-Item -ItemType Directory -Path (Join-Path $root '.tmp') -Force | Out-Null

$goarch = switch ($env:PROCESSOR_ARCHITECTURE) {
    'AMD64' { 'amd64' }
    'ARM64' { 'arm64' }
    default { Stop-CbmInstall "unsupported architecture: $env:PROCESSOR_ARCHITECTURE" }
}
$platform = "windows-$goarch"
$version = $null
$repository = $null
$fields = $null
foreach ($line in [System.IO.File]::ReadAllLines($pin)) {
    if ($line.StartsWith('#') -or [string]::IsNullOrWhiteSpace($line)) { continue }
    $columns = $line.Split("`t")
    if ($columns[0] -eq 'version') { $version = $columns[1] }
    elseif ($columns[0] -eq 'repository') { $repository = $columns[1] }
    elseif ($columns[0] -eq $platform) { $fields = $columns }
}
if ([string]::IsNullOrEmpty($version) -or [string]::IsNullOrEmpty($repository)) {
    Stop-CbmInstall "$pin has no version or repository"
}
if ($null -eq $fields -or $fields.Count -lt 5) {
    Stop-CbmInstall "$pin has no entry for $platform"
}
$archiveName = $fields[1]
$archiveSha = $fields[2]
$binaryName = $fields[3]
$binarySha = $fields[4]

$destination = Join-Path $bin $binaryName
Assert-NotReparsePoint -Path $destination
if ((Test-Path -LiteralPath $destination -PathType Leaf) -and ((Get-Sha256 -Path $destination) -eq $binarySha)) {
    Write-Output "codebase-memory-mcp $version already installed in $bin"
    return
}

$stage = Join-Path $root ('.tmp\cbm-install.' + [System.Guid]::NewGuid().ToString('N'))
$extract = Join-Path $stage 'extract'
New-Item -ItemType Directory -Path $extract -Force | Out-Null
try {
    $archive = Join-Path $stage $archiveName
    Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/$repository/releases/download/$version/$archiveName" -OutFile $archive
    if ((Get-Sha256 -Path $archive) -ne $archiveSha) {
        Stop-CbmInstall "checksum verification failed for $archiveName"
    }
    Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
    $source = Join-Path $extract $binaryName
    if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
        Stop-CbmInstall "release archive does not contain $binaryName"
    }
    if ((Get-Sha256 -Path $source) -ne $binarySha) {
        Stop-CbmInstall "checksum verification failed for $binaryName"
    }
    $partial = Join-Path $bin ".$binaryName.new"
    Copy-Item -LiteralPath $source -Destination $partial -Force
    Move-Item -LiteralPath $partial -Destination $destination -Force
    Write-Output "installed codebase-memory-mcp $version into $bin"
} finally {
    if ($null -ne $stage -and (Test-Path -LiteralPath $stage)) {
        Remove-Item -LiteralPath $stage -Recurse -Force
    }
}
'''

[tasks."cbm:pin"]
description = "Pin a codebase-memory-mcp release: verify it and rewrite internal/cbmpin/cbm-pin.tsv (needs gh)."
usage = 'arg "<tag>" help "CBM release tag, for example v0.12.1"'
run = '''
set -euo pipefail
fail() { printf 'cbm:pin: %s\n' "$*" >&2; exit 1; }
tag=${usage_tag:-}
[[ -n $tag ]] || fail 'usage: mise run cbm:pin <tag>'
command -v gh >/dev/null || fail 'missing gh'
[[ -x .bin/cosign ]] || fail 'missing local cosign; run mise run tools:install'
root=$PWD
pin=$root/internal/cbmpin/cbm-pin.tsv
repository=DeusData/codebase-memory-mcp
identity="https://github.com/$repository/.github/workflows/release.yml@refs/heads/main"
issuer=https://token.actions.githubusercontent.com
mkdir -p "$root/.tmp"
stage=$(mktemp -d "$root/.tmp/cbm-pin.XXXXXX")
trap 'rm -rf "$stage"' EXIT INT TERM
gh release download "$tag" -R "$repository" -D "$stage" \
  -p checksums.txt -p checksums.txt.bundle -p release-selection.tsv
.bin/cosign verify-blob --bundle "$stage/checksums.txt.bundle" \
  --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$stage/checksums.txt"

checksum_of() {
  awk -v name="$1" '$2 == name {print $1}' "$stage/checksums.txt"
}
selection_sha=$(checksum_of release-selection.tsv)
if [[ -n $selection_sha ]]; then
  if command -v sha256sum >/dev/null 2>&1; then
    actual=$(sha256sum "$stage/release-selection.tsv")
  else
    actual=$(shasum -a 256 "$stage/release-selection.tsv")
  fi
  [[ ${actual%% *} == "$selection_sha" ]] || fail 'release-selection.tsv does not match checksums.txt'
fi

out=$stage/cbm-pin.tsv
{
  printf '%s\n' '# The codebase-memory-mcp (CBM) release that Concordia is tested with.'
  printf '%s\n' '# Read by the concordia binary (embedded: `concordia cbm install` and `doctor`) and by the mise task tools:cbm.'
  printf '%s\n' '# Linux uses the fully static "-portable" build, as the upstream installer does.'
  printf '%s\n' '# Regenerate with: mise run cbm:pin <tag>'
  printf '%s\n' '# Rows: "version <tag>", "repository <owner/name>", then one row per platform:'
  printf '%s\n' '# <goos-goarch> <archive> <archive sha256> <binary in archive> <binary sha256>'
  printf 'version\t%s\nrepository\t%s\n' "$tag" "$repository"
  for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 windows-arm64; do
    goos=${platform%%-*}
    target=$platform
    case $goos in
      linux) archive=codebase-memory-mcp-$platform-portable.tar.gz; target=$platform-portable; binary=codebase-memory-mcp ;;
      darwin) archive=codebase-memory-mcp-$platform.tar.gz; binary=codebase-memory-mcp ;;
      *) archive=codebase-memory-mcp-$platform.zip; binary=codebase-memory-mcp.exe ;;
    esac
    archive_sha=$(checksum_of "$archive")
    binary_sha=$(awk -F '\t' -v target="$target" '$1 == target {print $4}' "$stage/release-selection.tsv")
    [[ -n $archive_sha ]] || fail "checksums.txt has no entry for $archive"
    [[ -n $binary_sha ]] || fail "release-selection.tsv has no entry for $target"
    printf '%s\t%s\t%s\t%s\t%s\n' "$platform" "$archive" "$archive_sha" "$binary" "$binary_sha"
  done
} > "$out"
mv -f "$out" "$pin"
printf 'pinned codebase-memory-mcp %s in %s\n' "$tag" "$pin"
'''
run_windows = '''
[Console]::Error.WriteLine('cbm:pin needs bash; run it on Linux or macOS')
exit 1
'''

