[tasks."calm:update"]
description = "Pin the latest calm CLI release and build it."
run = [
  '''
set -euo pipefail
fail() { printf 'calm:update: %s\n' "$*" >&2; exit 1; }
command -v jq >/dev/null || fail 'missing jq'
command -v git >/dev/null || fail 'missing git'
[[ -x .bin/go/bin/go ]] || fail 'missing local Go; run mise run tools:install'
repository=https://github.com/finos/architecture-as-code
refs=$(git ls-remote --tags --refs "$repository" 'refs/tags/cli-v*')
tag=$(printf '%s\n' "$refs" | awk '{sub("refs/tags/", "", $2); print $2}' | grep -E '^cli-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
[[ -n $tag ]] || fail 'no cli-v* tags found'
commit=$(printf '%s\n' "$refs" | awk -v ref="refs/tags/$tag" '$2 == ref {print $1}')
mkdir -p test/parity
jq -n --indent 2 --arg repository "$repository" --arg tag "$tag" --arg commit "$commit" \
  '{repository: $repository, tag: $tag, commit: $commit}' > test/parity/upstream.json
printf 'pinned calm CLI %s (%s)\n' "$tag" "$commit"
''',
  { task = "calm:build" },
]
run_windows = '''
[Console]::Error.WriteLine('calm parity tasks need bash; run them on Linux or macOS')
exit 1
'''

[tasks."calm:build"]
description = "Check out and build the pinned calm CLI in .tmp/calm-upstream."
run = '''
set -euo pipefail
fail() { printf 'calm:build: %s\n' "$*" >&2; exit 1; }
command -v jq >/dev/null || fail 'missing jq'
command -v git >/dev/null || fail 'missing git'
[[ -x .bin/go/bin/go ]] || fail 'missing local Go; run mise run tools:install'
root=$PWD
pin=test/parity/upstream.json
[[ -f $pin ]] || fail 'missing test/parity/upstream.json; run mise run calm:update'
repository=$(jq -r .repository "$pin")
commit=$(jq -r .commit "$pin")
tag=$(jq -r .tag "$pin")
checkout=$root/.tmp/calm-upstream
# A cache hit also needs the Node.js of the checkout's .nvmrc (.bin and .tmp are removed separately).
if [[ -f $checkout/.concordia-commit && $(<"$checkout/.concordia-commit") == "$commit" && -f $checkout/cli/dist/index.js ]] &&
  [[ $(.bin/calm-node/bin/node --version 2>/dev/null) == "v$(tr -d '[:space:]' < "$checkout/.nvmrc" | sed 's/^v//')" ]]; then
  printf 'calm CLI %s already built\n' "$tag"
  exit 0
fi
rm -rf "$checkout"
mkdir -p "$checkout"
git -C "$checkout" init -q
git -C "$checkout" fetch -q --depth 1 "$repository" "$commit"
git -C "$checkout" checkout -q FETCH_HEAD
nvmrc=$(tr -d '[:space:]' < "$checkout/.nvmrc")
nvmrc=${nvmrc#v}
if [[ ! -x .bin/calm-node/bin/node ]] || [[ $(.bin/calm-node/bin/node --version 2>/dev/null) != "v$nvmrc" ]]; then
  rm -rf .tmp/calm-node-stage
  "{{mise_bin}}" install-into "node@$nvmrc" .tmp/calm-node-stage
  rm -rf .bin/calm-node
  mv .tmp/calm-node-stage .bin/calm-node
fi
# The user npm configuration must not change the upstream build.
: > "$root/.tmp/calm-npmrc"
export PATH=$root/.bin/calm-node/bin:$PATH HUSKY=0 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 NPM_CONFIG_USERCONFIG=$root/.tmp/calm-npmrc
cd "$checkout"
if ! { npm ci --ignore-scripts --no-audit --no-fund --include-workspace-root \
        --workspace calm-models --workspace calm-widgets --workspace shared --workspace cli &&
      npm run build:cli; }; then
  printf 'calm:build: workspace build failed; retrying with all workspaces\n' >&2
  npm ci --no-audit --no-fund || fail 'npm ci failed'
  npm run build:cli || fail 'npm run build:cli failed'
fi
printf '%s\n' "$commit" > "$checkout/.concordia-commit"
printf 'built calm CLI %s\n' "$tag"
'''
run_windows = '''
[Console]::Error.WriteLine('calm parity tasks need bash; run them on Linux or macOS')
exit 1
'''

