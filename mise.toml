[tasks."bench:smoke"]
description = "Run the oracle on every bench task; every task must score 1.0 (no LLM)."
depends = ["tools:cbm"]
dir = "{{config_root}}/bench"
usage = 'flag "--repo <id>" help "run only the tasks of this repository of bench/tasks.json"'
run = '''
set -euo pipefail
repo_args=() include=()
if [[ -n ${usage_repo:-} ]]; then
  repo_args=(--repo "$usage_repo")
  mapfile -t names < <(jq -r --arg r "$usage_repo" '.[] | select(.repo == $r) | "\(.repo)-\(.scenario)"' tasks.json)
  [[ -n ${names[*]:-} ]] || { printf 'bench:smoke: no tasks for %s in tasks.json\n' "$usage_repo" >&2; exit 1; }
  # harbor accepts --include-task-name only together with an explicit dataset path.
  include=(--path datasets/concordia-bench)
  for name in "${names[@]}"; do include+=(--include-task-name "$name"); done
fi
bash scripts/build-images.sh "${repo_args[@]}"
uv run --frozen python scripts/check_tasks.py datasets/concordia-bench "${repo_args[@]}"
# A named job: concurrent smoke runs of different repositories must not read each other's results.
job="smoke-${usage_repo:-all}-$(date -u +%Y%m%dT%H%M%S)"
uv run --frozen harbor run -c configs/smoke.yaml --job-name "$job" "${include[@]}"
uv run --frozen python scripts/analyze_results.py "jobs/$job" --require 1.0
'''
run_windows = '''
[Console]::Error.WriteLine('bench tasks need bash and Docker; run them on Linux or macOS')
exit 1
'''

[tasks."bench:run"]
description = "Run the terminus-2 agent on every bench task (needs OPENROUTER_API_KEY)."
depends = ["tools:cbm"]
dir = "{{config_root}}/bench"
usage = 'flag "--repo <id>" help "run only the tasks of this repository of bench/tasks.json"'
run = '''
set -euo pipefail
# harbor's --env-file overrides the environment, so check the key it will use.
key=${OPENROUTER_API_KEY:-}
if [[ -f .env ]] && grep -q '^OPENROUTER_API_KEY=' .env; then key=$(sed -n 's/^OPENROUTER_API_KEY=//p' .env); fi
[[ -n $key ]] || { printf 'bench:run: set OPENROUTER_API_KEY in bench/.env or the environment\n' >&2; exit 1; }
[[ $key != *$'\r'* ]] || { printf 'bench:run: OPENROUTER_API_KEY contains a carriage return; save bench/.env with LF line endings\n' >&2; exit 1; }
repo_args=() include=()
if [[ -n ${usage_repo:-} ]]; then
  repo_args=(--repo "$usage_repo")
  mapfile -t names < <(jq -r --arg r "$usage_repo" '.[] | select(.repo == $r) | "\(.repo)-\(.scenario)"' tasks.json)
  [[ -n ${names[*]:-} ]] || { printf 'bench:run: no tasks for %s in tasks.json\n' "$usage_repo" >&2; exit 1; }
  include=(--path datasets/concordia-bench)
  for name in "${names[@]}"; do include+=(--include-task-name "$name"); done
fi
bash scripts/build-images.sh "${repo_args[@]}"
uv run --frozen python scripts/check_tasks.py datasets/concordia-bench "${repo_args[@]}"
env_file=()
if [[ -f .env ]]; then env_file=(--env-file .env); fi
job="agent-${usage_repo:-all}-$(date -u +%Y%m%dT%H%M%S)"
uv run --frozen harbor run -c configs/agent.yaml --job-name "$job" "${env_file[@]}" "${include[@]}"
uv run --frozen python scripts/analyze_results.py "jobs/$job" --csv jobs/latest.csv
'''
run_windows = '''
[Console]::Error.WriteLine('bench tasks need bash and Docker; run them on Linux or macOS')
exit 1
'''

