[tasks."codescene:delta"]
description = "CodeScene delta of the branch against a base ref, without the bench mutation fixtures (needs CS_ACCESS_TOKEN)."
usage = 'arg "[base]" default="main" help="git ref to compare HEAD against"'
run = '''
set -euo pipefail
fail() { printf 'codescene:delta: %s\n' "$*" >&2; exit 1; }
[[ -n ${CS_ACCESS_TOKEN:-} ]] || fail 'set CS_ACCESS_TOKEN to a CodeScene personal access token'
# bench/testdata holds the mutation fixtures of the third-party bench repositories; they are not our code.
cs=$(command -v cs || ls -d "$HOME"/.cache/codehealth-mcp/MCP-*/cs 2>/dev/null | sort -V | tail -n 1 || true)
[[ -n $cs && -x $cs ]] || fail 'missing the cs CLI; install it or the CodeScene MCP server'
base=${usage_base:-main}
files=$(mktemp)
trap 'rm -f "$files"' EXIT
git diff --name-only --diff-filter=d "$base" HEAD -- . ':(exclude)bench/testdata/**' > "$files"
"$cs" delta "$base" --file-list "$files" --error-on-warnings
'''
run_windows = '''
[Console]::Error.WriteLine('codescene:delta needs bash; run it on Linux or macOS')
exit 1
'''

