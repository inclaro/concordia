[tasks.build]
description = "Build the local executable."
run = '''
set -euo pipefail
[[ -x .bin/go/bin/go ]] || { printf 'missing local Go; run mise run tools:install\n' >&2; exit 1; }
target_os=${GOOS:-$(.bin/go/bin/go env GOOS)}
suffix=
[[ $target_os == windows ]] && suffix=.exe
mkdir -p '{{vars.output_dir}}'
CGO_ENABLED=0 .bin/go/bin/go build -trimpath -o '{{vars.output_dir}}/{{vars.binary_name}}'"$suffix" './cmd/{{vars.binary_name}}'
'''
run_windows = '''
$ErrorActionPreference = 'Stop'
Set-StrictMode -Version 3.0
$root = (Get-Location).ProviderPath
$go = Join-Path $root '.bin\go\bin\go.exe'
if (-not (Test-Path -LiteralPath $go -PathType Leaf)) {
    throw 'missing local Go; run mise run tools:install'
}
$targetOS = $env:GOOS
if ([string]::IsNullOrEmpty($targetOS)) {
    $targetOS = (& $go env GOOS | Out-String).Trim()
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
}
$suffix = if ($targetOS -eq 'windows') { '.exe' } else { '' }
New-Item -ItemType Directory -Path '{{vars.output_dir}}' -Force | Out-Null
$env:CGO_ENABLED = '0'
& $go build -trimpath -o "{{vars.output_dir}}/{{vars.binary_name}}$suffix" './cmd/{{vars.binary_name}}'
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
'''

