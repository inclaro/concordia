[tasks.test]
description = "Run race-enabled shuffled tests."
run = '''
set -euo pipefail
[[ -x .bin/gotestsum ]] || { printf 'missing local gotestsum; run mise run tools:install\n' >&2; exit 1; }
[[ -x .bin/go/bin/go ]] || { printf 'missing local Go; run mise run tools:install\n' >&2; exit 1; }
.bin/gotestsum -- -race -shuffle=on ./...
'''
run_windows = '''
$ErrorActionPreference = 'Stop'
Set-StrictMode -Version 3.0
$root = (Get-Location).ProviderPath
$gotestsum = Join-Path $root '.bin\gotestsum.exe'
$go = Join-Path $root '.bin\go\bin\go.exe'
foreach ($tool in @($gotestsum, $go)) {
    if (-not (Test-Path -LiteralPath $tool -PathType Leaf)) {
        throw "missing local tool $tool; run mise run tools:install"
    }
}
& $gotestsum -- -race -shuffle=on ./...
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
'''

[tasks."test-reports"]
description = "Generate test JSON and atomic coverage reports."
run = '''
set -euo pipefail
for tool in .bin/go/bin/go .bin/gotestfmt; do
  [[ -x $tool ]] || { printf 'missing local tool %s; run mise run tools:install\n' "$tool" >&2; exit 1; }
done
rm -rf '{{vars.output_dir}}/coverage'
mkdir -p '{{vars.output_dir}}/coverage'
.bin/go/bin/go test -json -race -shuffle=on -covermode=atomic -coverprofile='{{vars.output_dir}}/coverage/coverage.out' ./... \
  | tee '{{vars.output_dir}}/test-results.json' \
  | .bin/gotestfmt
test -f '{{vars.output_dir}}/coverage/coverage.out'
.bin/go/bin/go tool cover -func='{{vars.output_dir}}/coverage/coverage.out' | tee '{{vars.output_dir}}/coverage/coverage.txt'
.bin/go/bin/go tool cover -html='{{vars.output_dir}}/coverage/coverage.out' -o '{{vars.output_dir}}/coverage/coverage.html'
'''
run_windows = '''
$ErrorActionPreference = 'Stop'
Set-StrictMode -Version 3.0
$root = (Get-Location).ProviderPath
$go = Join-Path $root '.bin\go\bin\go.exe'
$gotestfmt = Join-Path $root '.bin\gotestfmt.exe'
foreach ($tool in @($go, $gotestfmt)) {
    if (-not (Test-Path -LiteralPath $tool -PathType Leaf)) {
        throw "missing local tool $tool; run mise run tools:install"
    }
}
$output = Join-Path $root '{{vars.output_dir}}'
$coverage = Join-Path $output 'coverage'
$results = Join-Path $output 'test-results.json'
if (Test-Path -LiteralPath $coverage) {
    Remove-Item -LiteralPath $coverage -Recurse -Force
}
New-Item -ItemType Directory -Path $coverage -Force | Out-Null
$coverageOut = Join-Path $coverage 'coverage.out'
$testProcess = Start-Process -FilePath $go -ArgumentList @(
    'test',
    '-json',
    # No -race on Windows: the CI runner image has no C compiler.
    '-shuffle=on',
    '-covermode=atomic',
    '-coverprofile={{vars.output_dir}}/coverage/coverage.out',
    './...'
) -RedirectStandardOutput $results -NoNewWindow -Wait -PassThru
Get-Content -LiteralPath $results | & $gotestfmt
$formatExitCode = $LASTEXITCODE
if ($testProcess.ExitCode -ne 0) { exit $testProcess.ExitCode }
if ($formatExitCode -ne 0) { exit $formatExitCode }
if (-not (Test-Path -LiteralPath $coverageOut -PathType Leaf)) {
    throw "missing coverage profile: $coverageOut"
}
$coverageText = & $go tool cover "-func=$coverageOut"
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
$coverageText | Tee-Object -FilePath (Join-Path $coverage 'coverage.txt')
& $go tool cover "-html=$coverageOut" "-o=$(Join-Path $coverage 'coverage.html')"
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
'''

