[tasks."update-deps"]
description = "Update direct dependencies within their current major versions."
run = '''
set -euo pipefail
[[ -x .bin/go/bin/go ]] || { printf 'missing local Go; run mise run tools:install\n' >&2; exit 1; }
mapfile -t direct_modules < <(.bin/go/bin/go mod edit -json | jq -r '.Require // [] | .[] | select(.Indirect | not) | .Path')
if [[ -n ${direct_modules[*]-} ]]; then
  .bin/go/bin/go get -u "${direct_modules[@]}"
fi
.bin/go/bin/go mod tidy -compat=1.26
'''
run_windows = '''
$ErrorActionPreference = 'Stop'
Set-StrictMode -Version 3.0
$go = Join-Path (Get-Location).ProviderPath '.bin\go\bin\go.exe'
if (-not (Test-Path -LiteralPath $go -PathType Leaf)) {
    throw 'missing local Go; run mise run tools:install'
}
$moduleJson = (& $go mod edit -json | Out-String)
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
$module = $moduleJson | ConvertFrom-Json
$directModules = @(
    $module.Require |
        Where-Object { -not $_.Indirect } |
        Select-Object -ExpandProperty Path
)
if ($directModules.Count -gt 0) {
    & $go get -u @directModules
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
}
& $go mod tidy -compat=1.26
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
'''

