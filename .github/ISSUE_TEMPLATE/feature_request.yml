name: Feature request
description: Propose a new feature or a change to Concordia.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The problem that you want to solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you propose to solve the problem.
    validations:
      required: true
