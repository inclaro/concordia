name: Bench oracle smoke

# Runs the Harbor oracle on every concordia-bench task: Concordia against ten
# real repositories, one job per repository, with no LLM and no secrets. Every
# task must score 1.0.

on:
  pull_request:
    paths:
      - "bench/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "mise.toml"
      - ".github/workflows/bench-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its running smoke: the matrix is long.
concurrency:
  group: bench-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oracle-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        repo: [fzf, browser-use, hoppscotch, nushell, gitea, argo-cd, knative-serving, volcano, strimzi, airflow]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: "2026.10.17"
          install: false

      - name: Verify host prerequisites
        run: |
          bash --version
          git --version
          jq --version
          docker --version

      - name: Install uv
        run: pipx install uv==0.13.7

      - name: Install repository-local development tools
        run: mise run tools:install

      - name: Install the bench tooling
        run: mise run bench:setup

      - name: Test the verifier library
        if: matrix.repo == 'fzf'
        run: mise run bench:test

      - name: Run the oracle on the tasks of ${{ matrix.repo }}
        run: mise run bench:smoke --repo ${{ matrix.repo }}

      - name: Upload the job results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-oracle-jobs-${{ matrix.repo }}
          path: bench/jobs
          if-no-files-found: ignore
