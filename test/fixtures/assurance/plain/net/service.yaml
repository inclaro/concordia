apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: payments
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: payments
spec:
  selector:
    app: worker
  ports:
    - port: 80
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: reports
  namespace: payments
spec:
  selector:
    app: reports
  ports:
    - port: 80
