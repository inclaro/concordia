apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shop-staging
spec:
  ports:
  - port: 80
  selector:
    app: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api
  name: api
  namespace: shop-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - image: registry.example.com/shop/api:1.4.1-rc1
        name: api
      - image: registry.example.com/shop/api-sidecar:1.5.0
        name: sidecar
