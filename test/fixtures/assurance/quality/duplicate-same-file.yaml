apiVersion: concordia.io/v1alpha1
kind: QualityScenarioSet
scenarios:
  - id: QS-TWICE
    area: availability
    qualityAttribute: availability
    stimulusSource: operator
    stimulus: the primary database node fails
    environment: production
    expectedResponse: a replica takes over
    owner: platform-team
    scope: [orders-db]
    mode: reviewed
    criterion: {subject: failover-drill, authority: sre-lead}
  - id: QS-TWICE
    area: operability
    qualityAttribute: operability
    stimulusSource: operator
    stimulus: a node is drained
    environment: production
    expectedResponse: traffic moves away
    owner: platform-team
    scope: [orders-service]
    mode: reviewed
    criterion: {subject: drain-drill, authority: sre-lead}
