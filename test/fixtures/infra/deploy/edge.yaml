apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: payments
  labels:
    app: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge
  template:
    metadata:
      labels:
        app: edge
    spec:
      containers:
        - name: edge
          image: registry.example.com/payments/edge:0.1.0
