apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: payments
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: registry.example.com/payments/worker@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
