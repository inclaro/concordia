apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  namespace: payments
  labels:
    app: reports
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reports
  template:
    metadata:
      labels:
        app: reports
    spec:
      containers:
        - name: reports
          image: registry.example.com/payments/reports:2.1.0
