    fixtures: [commerce.json]
  - family: ambiguous-usage
    level: supported
    maturity: stable
    nativeEdges:
      - type: USAGE
        absent: [ref]
    fixtures: [commerce.json]
  - family: uses-type
    level: unsupported
    maturity: advisory
  - family: constructs
    level: unsupported
    maturity: advisory
  - family: calls-grpc
    level: unsupported
    maturity: advisory
  - family: calls-graphql
    level: unsupported
    maturity: advisory
  - family: calls-trpc
    level: unsupported
    maturity: advisory
  - family: deploys-artifact
    level: supported
    maturity: advisory
    lossModes: [deploy-target-is-file]
    nativeEdges:
      - type: DEPLOYS
        discriminators:
          via: [kubectl, helm, chart]
    requiredProperties: [via]
    fixtures: [infra.json]
  - family: selects-workload
    level: partial
    maturity: advisory
    lossModes: [selector-join-directory-scoped, selector-join-one-of-competing, empty-selector, unsupported-selector-expression]
    nativeEdges:
      - type: INFRA_MAPS
        discriminators:
          kind: [selector]
    requiredProperties: [kind]
    fixtures: [infra.json]
  - family: routes-to
    level: partial
    maturity: advisory
