    fixtures: [infra.json]
  - family: overrides
    level: partial
    maturity: advisory
    lossModes: [override-unsignalled]
    nativeEdges:
      - type: OVERRIDE
        discriminators:
          via: [tfvars, patch]
    requiredProperties: [via]
    fixtures: [infra.json]
  - family: includes-infrastructure
    level: supported
    maturity: advisory
    nativeEdges:
      - type: IMPORTS
        discriminators:
          via: [terraform]
      - type: IMPORTS
        sourceFiles: [kustomization.yaml, kustomization.yml]
    fixtures: [infra.json]
  - family: infrastructure-dependency
    level: supported
    maturity: advisory
    nativeEdges:
      - type: DEPENDS_ON
        discriminators:
          via: [depends_on]
      - type: DEPENDS_ON
        present: [repository]
        absent: [via]
      - type: USAGE
        discriminators:
          via: [terraform]
          ref: [var, module, output, resource]
