# Capability profile of codebase-memory-mcp 0.12.1 with adapter schema concordia-cbm/v2.
# Grounded in the committed recordings (test/fixtures/cbm-recordings/infra.json, commerce.json) and the observations O1-O12 listed in test/fixtures/infra/README.md.
# Family names equal canonical edge kinds, plus the property families
# container-occurrence-versions, rendered-templates, index-result,
# deployment-workload-set, dockerfile-set, documentation-metadata and diagram-identity. The digest is computed by the loader.
id: cbm-0.12.1
provider: codebase-memory-mcp
build:
  version: 0.12.1
  adapterSchema: concordia-cbm/v2
families:
  - family: contains
    level: supported
    maturity: stable
    nativeEdges:
      - type: CONTAINS_FILE
      - type: CONTAINS_FOLDER
    fixtures: [commerce.json]
  - family: defines
    level: supported
    maturity: stable
    nativeEdges:
      - type: DEFINES
      - type: DEFINES_METHOD
    fixtures: [commerce.json]
  - family: imports
    level: supported
    maturity: stable
    nativeEdges:
      - type: IMPORTS
    fixtures: [commerce.json]
  - family: inherits
    level: supported
    maturity: stable
    nativeEdges:
      - type: INHERITS
    fixtures: [commerce.json]
  - family: implements
    level: supported
    maturity: stable
    nativeEdges:
      - type: IMPLEMENTS
    fixtures: [commerce.json]
  - family: calls
    level: supported
    maturity: stable
