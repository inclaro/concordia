# Supersession variants SUP-V01 to SUP-V17 of the ADR governance change (tasks 1.4, 4.x).
#
# The decisions are the `ADR` nodes that CBM 0.12.1 gave for the files of test/fixtures/adr/docs/adr/variants
# (recording test/fixtures/cbm-recordings/adr.json, O12); TestVariantsMatchTheRecording compares them with the
# recording. Each variant has its own directory and its own ADR numbers, so the variants never interfere.
#
# decisions   the ADR nodes: path (identity), adrId (label only), title, status (normalized), statusText (raw),
#             date, supersededBy (link text, verbatim), line
# supersedes  the `supersedes` edges, new decision (from) to old decision (to), both by path
# registerIds register IDs that a test registers for the variant (unpinned): decisions that match by canonical ID
# expect      what the history evaluation gives when every decision of the variant is committed:
#   links        successor, predecessor, provenance (edge | metadata | both), effect (effective | pending)
#   anomalies    kind (a history finding reason), paths (sorted), value (raw `superseded_by` of a missing target,
#                the shared label of a duplicate ID)
#   ambiguous    true when the component has an anomaly: every member is then `ambiguous`
#   applicability  per decision path: active | inactive | superseded | ambiguous
#   heads        decisions without an effective successor in a component without an anomaly (sorted)
#   statusLags   predecessors whose own status is not `superseded` while an effective successor exists
#   matches      register ID to the path that the canonical ID comparison selects
variants:
  - id: SUP-V01
    title: "edge only"
    note: "The predecessor says only `Superseded`; the successor links it with a `Supersedes` statement."
    decisions:
      - path: "docs/adr/variants/v01/0101-cache-local.md"
        adrId: "ADR-101"
        title: "ADR-0101: Local cache"
        status: "superseded"
        statusText: "Superseded"
        date: "2026-01-01"
        supersededBy: ""
        line: 1
      - path: "docs/adr/variants/v01/0102-cache-shared.md"
        adrId: "ADR-102"
        title: "ADR-0102: Shared cache"
        status: "accepted"
        statusText: "Accepted"
        date: "2026-02-01"
        supersededBy: ""
        line: 1
    supersedes:
      - {from: "docs/adr/variants/v01/0102-cache-shared.md", to: "docs/adr/variants/v01/0101-cache-local.md", line: 7}
    expect:
      links:
        - {successor: "docs/adr/variants/v01/0102-cache-shared.md", predecessor: "docs/adr/variants/v01/0101-cache-local.md", provenance: edge, effect: effective}
      anomalies: []
      ambiguous: false
      applicability:
        "docs/adr/variants/v01/0101-cache-local.md": superseded
        "docs/adr/variants/v01/0102-cache-shared.md": active
      heads: ["docs/adr/variants/v01/0102-cache-shared.md"]
      statusLags: []
