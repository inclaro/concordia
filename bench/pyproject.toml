[project]
name = "concordia-bench"
version = "0.1.0"
description = "Concordia real-world evaluation bench on Harbor"
requires-python = ">=3.12,<3.14"
dependencies = [
    "harbor==0.25.0",
    "pyyaml>=6,<7",
    "tabulate>=0.9,<1",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["lib"]
testpaths = ["lib/tests"]
