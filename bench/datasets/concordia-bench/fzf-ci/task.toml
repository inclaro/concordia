schema_version = "1.4"

[task]
name = "concordia-bench/fzf-ci"
version = "1.0.0"
description = "Add the Concordia CI pipeline with offline checks and JUnit/SARIF reports to fzf."
keywords = ["concordia", "calm", "architecture", "go", "fzf", "ci"]

[metadata]
