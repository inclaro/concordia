apiVersion: concordia.io/v1alpha1
kind: Workspace
metadata:
  name: knative-serving
architecture:
  source: architecture/knative-serving.calm.json
observation:
  provider: codebase-memory-mcp
  indexMode: moderate
  projects:
  - name: knative-serving
    root: .
    include: [cmd/**, pkg/**, config/core/**]
environments:
- id: production
  sources: [config/core/**]
bindings:
  files: [bindings/concordia.bindings.yaml]
policies:
  files: [policies/*.policy.yaml]
exceptions:
  baseline: exceptions/concordia.baseline.json
  waivers: exceptions/waivers.yaml
check:
  minimumCoverage: 0.9
  unknown: fail
  failOn: error
views:
- id: kn-deployment
  kind: deployment
  origin: generated
  owner: team-knative-serving
  scope: [kn-activator, kn-autoscaler, kn-controller, kn-webhook, kn-ns]
  abstraction: deployment
  environment: production
  output:
    path: docs/architecture/kn-deployment.dsl
    exports:
    - format: plantuml
      path: docs/architecture/kn-deployment.puml
    - format: dot
      path: docs/architecture/kn-deployment.dot
  comparison: {against: [declared]}
- id: kn-container
  kind: container
  origin: generated
  owner: team-knative-serving
  scope: [kn-serving]
  abstraction: container
  output:
    path: docs/architecture/kn-container.dsl
    exports:
    - format: json
      path: docs/architecture/kn-container.json
  comparison: {against: [declared]}
