apiVersion: concordia.io/v1alpha1
kind: Workspace
metadata:
  name: volcano
architecture:
  source: architecture/volcano.calm.json
observation:
  provider: codebase-memory-mcp
  indexMode: moderate
  projects:
  - name: volcano
    root: .
    include:
    - cmd/scheduler/**
    - cmd/controller-manager/**
    - cmd/webhook-manager/**
    - cmd/agent/**
    - pkg/scheduler/**
    - pkg/controllers/**
    - pkg/webhooks/**
    - pkg/agent/**
    - pkg/util/**
    - pkg/kube/**
    - pkg/features/**
    - pkg/config/**
    - pkg/signals/**
    - pkg/version/**
    - pkg/filewatcher/**
bindings:
  files: [bindings/concordia.bindings.yaml]
policies:
  files: [policies/*.policy.yaml]
exceptions:
  baseline: exceptions/concordia.baseline.json
  waivers: exceptions/waivers.yaml
check:
  minimumCoverage: 0.9
  unknown: fail
  failOn: error
