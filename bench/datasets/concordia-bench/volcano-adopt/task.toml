tags = ["volcano", "go", "adopt"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 2400.0

[environment]
network_mode = "public"
cpus = 4
memory_mb = 8192
storage_mb = 20480
build_timeout_sec = 600.0
