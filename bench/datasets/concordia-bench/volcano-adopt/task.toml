schema_version = "1.4"

[task]
name = "concordia-bench/volcano-adopt"
version = "1.0.0"
description = "Adopt Concordia on Volcano: CALM model, bindings, plugin policy pack and a baseline."
keywords = ["concordia", "calm", "architecture", "go", "volcano", "adopt"]

[metadata]
difficulty = "medium"
