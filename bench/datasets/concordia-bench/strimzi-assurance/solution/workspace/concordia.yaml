apiVersion: concordia.io/v1alpha1
kind: Workspace
metadata:
  name: strimzi
architecture:
  source: architecture/strimzi.calm.json
  urlMapping: architecture/url-mapping.json
observation:
  provider: codebase-memory-mcp
  indexMode: moderate
  projects:
  - name: strimzi
    root: .
    include: [cluster-operator/src/main/**, topic-operator/src/main/**, user-operator/src/main/**, operator-common/src/main/**, certificate-issuer/src/main/**, config-model/src/main/**, api/src/main/**]
environments:
- id: install
  sources: [packaging/helm-charts/helm3/strimzi-kafka-operator/**]
- id: edge
  sources: [packaging/helm-charts/helm3/strimzi-kafka-operator/**]
bindings:
  files: [bindings/concordia.bindings.yaml]
policies:
  files: [policies/strimzi-adopt.policy.yaml, policies/strimzi-assurance.policy.yaml]
assurance:
  rendering:
    sources:
    - {environment: install, tool: helm, path: packaging/helm-charts/helm3/strimzi-kafka-operator, release: strimzi, namespace: strimzi}
    - {environment: edge, tool: helm, path: packaging/helm-charts/helm3/strimzi-kafka-operator, release: strimzi, namespace: strimzi}
  evaluators:
  - {environment: install, kinds: [rbac], assumes: [rbac-authorizer-enabled]}
  verification:
    results: [build/results/*.json]
exceptions:
  baseline: exceptions/concordia.baseline.json
  waivers: exceptions/waivers.yaml
check:
  minimumCoverage: 0.9
  unknown: fail
  failOn: error
