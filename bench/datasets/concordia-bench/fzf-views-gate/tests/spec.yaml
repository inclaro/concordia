repo: fzf
checks:
- id: detects-draw-protector
  type: results
  dimension: detection
  weight: 1
  branch: pr/draw-protector-using-utilities
  expectExit: 1
  findings:
  - {"ruleId": "VIEW-CORR-001", "kind": "view-drift", "location.path": "docs/architecture/components.md", "disposition": "active"}
- id: review-draw-protector
  type: review_report
  dimension: reporting
  weight: 3
  path: review.json
  branch: pr/draw-protector-using-utilities
  expectVerdict: fail
  expectViolations:
  - ruleId: VIEW-CORR-001
    path: docs/architecture/components.md
- id: detects-renderer-model
