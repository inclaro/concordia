schema_version = "1.4"

[task]
name = "concordia-bench/gitea-gate"
version = "1.0.0"
description = "Gate a Gitea pull request, write the review and waive the accepted finding."
keywords = ["concordia", "calm", "architecture", "go", "gitea", "gate"]

[metadata]
difficulty = "hard"
