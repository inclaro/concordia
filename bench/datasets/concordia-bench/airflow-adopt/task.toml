schema_version = "1.4"

[task]
name = "concordia-bench/airflow-adopt"
version = "1.0.0"
description = "Adopt Concordia on Airflow: CALM model, bindings, isolation policy pack and a baseline."
keywords = ["concordia", "calm", "python", "airflow", "adopt"]

[metadata]
difficulty = "hard"
category = "adopt"
tags = ["airflow", "python", "adopt"]

[agent]
timeout_sec = 5400.0

[verifier]
timeout_sec = 3600.0

[environment]
network_mode = "public"
cpus = 4
memory_mb = 12288
storage_mb = 20480
build_timeout_sec = 600.0
