repo: airflow
checks:
- id: committed
  type: committed
  dimension: workspace
  weight: 2
  paths:
  - concordia.yaml
  - architecture
  - bindings
  - policies
  - exceptions
  branch: main
- id: model-valid
  type: model_valid
  dimension: workspace
  weight: 2
- id: calm-nodes
  type: calm_nodes
  dimension: workspace
  weight: 2
  nodes:
  - id: af-api-server
    nodeType: service
    tags:
    - presentation
  - id: af-execution-api
    nodeType: service
    tags:
    - contract
  - id: af-scheduler
    nodeType: service
  - id: af-dag-processing
    nodeType: service
  - id: af-executors
    nodeType: service
  - id: af-models
    nodeType: service
    tags:
    - domain
  - id: af-metadata-db
    nodeType: database
  - id: af-task-sdk
    nodeType: service
    tags:
    - contract
  - id: af-task-runner
    nodeType: service
  - id: af-provider-standard
    nodeType: service
- id: relationships
  type: relationships
  dimension: workspace
  weight: 1
  connects:
  - - af-api-server
    - af-dag-processing
  - - af-api-server
    - af-execution-api
  - - af-api-server
    - af-metadata-db
  - - af-api-server
    - af-models
