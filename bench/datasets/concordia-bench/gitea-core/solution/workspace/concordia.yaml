apiVersion: concordia.io/v1alpha1
kind: Workspace
metadata:
  name: gitea
architecture:
  source: architecture/gitea.calm.json
observation:
  provider: codebase-memory-mcp
  indexMode: moderate
  projects:
  - name: gitea
    root: .
    include:
    - main.go
    - cmd/**
    - routers/**
    - services/**
    - models/**
    - modelmigration/**
    - modules/**
bindings:
  files:
  - bindings/concordia.bindings.yaml
policies:
  files:
  - policies/gitea-adopt.policy.yaml
  packs:
  - use: builtin:core
    rules:
      CORE-DECL-001:
        evidence:
          minimumConfidence: syntactic
      CORE-LYR-003:
        severity: error
      CORE-SEC-001:
        enabled: false
      CORE-OBS-001:
        evidence:
          onUnknown: warn
exceptions:
  baseline: exceptions/concordia.baseline.json
  waivers: exceptions/waivers.yaml
check:
  minimumCoverage: 0.9
  unknown: fail
  failOn: error
