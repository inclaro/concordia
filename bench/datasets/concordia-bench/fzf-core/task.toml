schema_version = "1.4"

[task]
name = "concordia-bench/fzf-core"
version = "1.0.0"
description = "Enable the built-in core pack on fzf with tags and rule overrides."
keywords = ["concordia", "calm", "architecture", "go", "fzf", "core"]

[metadata]
difficulty = "easy"
category = "core"
tags = ["fzf", "go", "core"]

[agent]
timeout_sec = 2400.0

[verifier]
timeout_sec = 1800.0

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 20480
build_timeout_sec = 600.0
