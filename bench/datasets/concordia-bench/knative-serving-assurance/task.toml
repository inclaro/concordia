schema_version = "1.4"

[task]
name = "concordia-bench/knative-serving-assurance"
version = "1.0.0"
description = "Render the manifests, run the RBAC evaluator and assert effective access."
keywords = ["concordia", "calm", "architecture", "go", "knative-serving", "assurance"]

[metadata]
difficulty = "hard"
category = "assurance"
tags = ["knative-serving", "go", "assurance"]

