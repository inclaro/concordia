schema_version = "1.4"

[task]
name = "concordia-bench/hoppscotch-adopt"
version = "1.0.0"
description = "Adopt Concordia on Hoppscotch: CALM model, bindings, policy pack and a baseline."
keywords = ["concordia", "calm", "architecture", "typescript", "hoppscotch", "adopt"]

[metadata]
difficulty = "medium"
category = "adopt"
tags = ["hoppscotch", "typescript", "adopt"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 2400.0

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 20480
build_timeout_sec = 600.0
