schema_version = "1.4"

[task]
name = "concordia-bench/hoppscotch-containers"
version = "1.0.0"
description = "Bind Hoppscotch to its Compose and Dockerfile deployment and add typed container rules."
keywords = ["concordia", "calm", "architecture", "typescript", "hoppscotch", "containers"]

[metadata]
difficulty = "medium"
category = "containers"
tags = ["hoppscotch", "typescript", "containers"]

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 2400.0

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 20480
build_timeout_sec = 600.0
