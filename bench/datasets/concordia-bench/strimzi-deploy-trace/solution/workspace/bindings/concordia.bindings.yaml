apiVersion: concordia.io/v1alpha1
kind: BindingSet
bindings:
- id: bind-stz-cluster-operator
  architectureRef: calm:node:stz-cluster-operator
  match:
    any:
    - sourceRoot: cluster-operator/src/main/**
    - {kind: workload, environment: install, resourceKind: Deployment, name: strimzi-cluster-operator}
    - {kind: workload, environment: install-hydrated, resourceKind: Deployment, name: strimzi-cluster-operator}
    - {kind: image, repository: quay.io/strimzi/operator}
- id: bind-stz-topic-operator
  architectureRef: calm:node:stz-topic-operator
  match:
    any:
    - sourceRoot: topic-operator/src/main/**
    - {kind: workload, environment: install, resourceKind: Deployment, name: strimzi-topic-operator}
    - {kind: workload, environment: install-hydrated, resourceKind: Deployment, name: strimzi-topic-operator}
- id: bind-stz-user-operator
  architectureRef: calm:node:stz-user-operator
  match:
    any:
    - sourceRoot: user-operator/src/main/**
    - {kind: workload, environment: install, resourceKind: Deployment, name: strimzi-user-operator}
    - {kind: workload, environment: install-hydrated, resourceKind: Deployment, name: strimzi-user-operator}
- id: bind-stz-operator-common
  architectureRef: calm:node:stz-operator-common
  match:
    any:
    - sourceRoot: operator-common/src/main/**
- id: bind-stz-certificate-issuer
  architectureRef: calm:node:stz-certificate-issuer
  match:
    any:
    - sourceRoot: certificate-issuer/src/main/**
- id: bind-stz-config-model
  architectureRef: calm:node:stz-config-model
  match:
    any:
    - sourceRoot: config-model/src/main/**
- id: bind-stz-api
  architectureRef: calm:node:stz-api
  match:
    any:
    - sourceRoot: api/src/main/**
- id: bind-stz-access-operator
  architectureRef: calm:node:stz-access-operator
  required: false
  match:
    any:
    - {kind: workload, environment: install, resourceKind: Deployment, name: strimzi-access-operator}
    - {kind: workload, environment: install-hydrated, resourceKind: Deployment, name: strimzi-access-operator}
    - {kind: image, repository: quay.io/strimzi/access-operator}
- id: bind-stz-strimzi-ns
  architectureRef: calm:node:stz-strimzi-ns
  required: false
  match:
    any:
    - {kind: infraResource, environment: install-hydrated, address: core/Namespace/_/strimzi}
- id: bind-stz-access-ns
  architectureRef: calm:node:stz-access-ns
  required: false
  match:
    any:
    - {kind: infraResource, environment: install, address: core/Namespace/_/strimzi-access-operator}
    - {kind: infraResource, environment: install-hydrated, address: core/Namespace/_/strimzi-access-operator}
