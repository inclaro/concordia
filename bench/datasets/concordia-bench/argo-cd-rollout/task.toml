schema_version = "1.4"

[task]
name = "concordia-bench/argo-cd-rollout"
version = "1.0.0"
description = "Roll out the Argo CD security obligations with per-environment enforcement and a rollout report."
keywords = ["concordia", "calm", "architecture", "go", "argo-cd", "rollout"]

[metadata]
difficulty = "hard"
category = "rollout"
tags = ["argo-cd", "go", "rollout"]

[agent]
timeout_sec = 5400.0

[verifier]
timeout_sec = 3600.0

[environment]
network_mode = "public"
cpus = 4
memory_mb = 8192
storage_mb = 20480
build_timeout_sec = 600.0
