schema_version = "1.4"

[task]
name = "concordia-bench/argo-cd-adopt"
version = "1.0.0"
description = "Adopt Concordia on Argo CD: CALM model, bindings, policy pack and a baseline."
keywords = ["concordia", "calm", "architecture", "go", "argo-cd", "adopt"]

[metadata]
difficulty = "hard"
category = "adopt"
tags = ["argo-cd", "go", "adopt"]

[agent]
timeout_sec = 5400.0

[verifier]
timeout_sec = 3600.0

[environment]
network_mode = "public"
cpus = 4
memory_mb = 8192
storage_mb = 20480
build_timeout_sec = 600.0
