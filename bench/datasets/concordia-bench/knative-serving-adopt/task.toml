schema_version = "1.4"

[task]
name = "concordia-bench/knative-serving-adopt"
version = "1.0.0"
description = "Adopt Concordia on knative-serving: CALM model, bindings, policy pack and a baseline."
keywords = ["concordia", "calm", "architecture", "go", "knative-serving", "adopt"]

[metadata]
difficulty = "hard"
category = "adopt"
tags = ["knative-serving", "go", "adopt"]

[agent]
timeout_sec = 3600.0

[verifier]
