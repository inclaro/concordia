schema_version = "1.4"

[task]
name = "concordia-bench/fzf-adopt"
version = "1.0.0"
description = "Adopt Concordia on fzf: CALM model, bindings, policy pack and a baseline."
keywords = ["concordia", "calm", "architecture", "go", "fzf", "adopt"]

[metadata]
difficulty = "easy"
category = "adopt"
tags = ["fzf", "go", "adopt"]

[agent]
timeout_sec = 2400.0

[verifier]
timeout_sec = 1800.0

[environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 20480
build_timeout_sec = 600.0
