repo: fzf
checks:
- id: committed
  type: committed
  dimension: workspace
  weight: 2
  paths:
  - concordia.yaml
  - architecture
  - bindings
  - policies
  - exceptions
  branch: main
- id: model-valid
  type: model_valid
  dimension: workspace
  weight: 2
- id: calm-nodes
  type: calm_nodes
  dimension: workspace
  weight: 2
  nodes:
  - id: fzf-cli
    nodeType: service
  - id: fzf-core
    nodeType: service
  - id: fzf-tui
    nodeType: service
  - id: fzf-algo
    nodeType: service
  - id: fzf-protector
    nodeType: service
  - id: fzf-util
    nodeType: service
    tags:
    - shared
- id: relationships
  type: relationships
  dimension: workspace
  weight: 1
  connects:
  - - fzf-cli
    - fzf-core
  - - fzf-cli
    - fzf-protector
  - - fzf-core
    - fzf-tui
  - - fzf-core
    - fzf-algo
  - - fzf-core
    - fzf-util
  - - fzf-tui
    - fzf-util
  - - fzf-algo
    - fzf-util
- id: bound-nodes
  type: bound_nodes
  dimension: workspace
  weight: 2
  ids:
  - fzf-cli
  - fzf-core
  - fzf-tui
  - fzf-algo
  - fzf-protector
  - fzf-util
- id: rules-declared
  type: rules_declared
  dimension: workspace
  weight: 2
  rules:
  - id: FZF-LYR-001
    predicate: layerOrder
    severity: error
  - id: FZF-CYC-001
    predicate: budget
    severity: error
- id: check-clean
  type: results
  dimension: conformance
  weight: 3
  expectExit: 0
  select:
  - path: summary.rules.unknown
    equals: 0
- id: detects-layer-inversion
  type: results
  dimension: detection
  weight: 3
  mutations:
  - algo-imports-core
  expectExit: 1
  findings:
  - ruleId: FZF-LYR-001
    kind: layer-violation
    location.path: src/algo/bench_core.go
    disposition: active
- id: detects-new-cycle
  type: results
  dimension: detection
  weight: 3
  mutations:
  - util-protector-ping-pong
  expectExit: 1
  findings:
  - ruleId: FZF-CYC-001
    kind: budget-exceeded
    disposition: active
- id: allows-tui-imports-util
  type: results
  dimension: detection
  weight: 2
  mutations:
  - tui-imports-util
  expectExit: 0
  absent:
  - location.path: src/tui/bench_util.go
    disposition: active
- id: deterministic
  type: deterministic
  dimension: determinism
  weight: 1
