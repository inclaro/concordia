    - INFRA-PLC-001
    - INFRA-PLC-002
    - INFRA-TRC-001
    - INFRA-TRC-002
    - INFRA-TRC-004
    - INFRA-TRC-003
    result: pass
  select:
  - path: deploymentTrace.environments[name=chart].coverage.lossModes
    contains: unrendered-template
  - path: deploymentTrace.environments[name=chart].coverage.status
    equals: partial
- id: plain-manifest-resolves-only-its-workload
  type: results
  dimension: deployment
  weight: 3
  mutations:
  - trace-plain-dag-processor
  expectExit: 0
  areas:
    deploymentTrace: unknown
  findings:
