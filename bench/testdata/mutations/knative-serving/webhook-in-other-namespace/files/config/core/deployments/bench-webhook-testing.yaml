apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook
  namespace: knative-testing
  labels:
    app: webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook
  template:
    metadata:
      labels:
        app: webhook
    spec:
      serviceAccountName: controller
      containers:
      - name: webhook
        image: ko://knative.dev/serving/cmd/webhook
