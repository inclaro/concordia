apiVersion: concordia.io/v1alpha1
kind: Workspace
metadata:
  name: nushell
architecture:
  source: architecture/nushell.calm.json
  urlMapping: architecture/url-mapping.json
observation:
  provider: codebase-memory-mcp
  indexMode: moderate
  projects:
  - name: nushell
    root: .
    include: ['crates/*/src/**']
bindings:
  files: [bindings/concordia.bindings.yaml]
environments:
- id: ci
  sources: [Cargo.toml]
policies:
  files: [policies/nushell-adopt.policy.yaml, policies/nushell-quality.policy.yaml]
assurance:
  verification:
    results: [build/results/*.json]
  quality:
    scenarios: [quality/*.yaml]
    requiredAreas: [modifiability, availability, security]
exceptions:
  baseline: exceptions/concordia.baseline.json
  waivers: exceptions/waivers.yaml
check:
  minimumCoverage: 0.9
  unknown: fail
  failOn: error
